[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ingest-orquestator-server"
version = "0.1.0"
description = "Docling-based ingestion orchestration service for parsing documents into normalized outputs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Ingest Orquestator Maintainers" }
]
dependencies = [
  "docling[xbrl]>=2.30,<3",
  "arelle-release>=2.41,<3",
  "dramatiq[rabbitmq]>=1.17,<2",
  "elasticsearch>=9,<10",
  "fastapi>=0.115,<1",
  "transformers>=4.57,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
gpu = [
  "docling-surya==0.1.0; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]
flash-attn = [
  "flash-attn>=2.8.3,<3; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "ninja>=1.13,<2; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "packaging>=24,<26; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "psutil>=7,<8; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]
surya = [
  "docling-surya==0.1.0; python_version >= '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_orquestator_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "gpu: tests that require a GPU runtime or large model dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
