services:
  ingest-orquestator-server:
    build: .
    image: ingest-orquestator-server:local
    environment:
      INGEST_SERVICE_NAME: ingest-orquestator-server
      INGEST_STORAGE_DIR: /app/.data
      INGEST_MAX_UPLOAD_SIZE_MB: 100
      INGEST_ALLOWED_UPLOAD_EXTENSIONS: .pdf,.md,.markdown,.txt,.html,.htm,.docx,.pptx
      INGEST_CHUNKING_ENABLED: "false"
      INGEST_CHUNKING_STRATEGY: page
      INGEST_CHUNK_MAX_TOKENS: 768
      INGEST_CHUNK_TOKENIZER_PATH: ""
      INGEST_RETENTION_DAYS: 30
      DOCLING_CACHE_DIR: /datastore/models/docling
      HF_HOME: /datastore/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /datastore/models/sentence-transformers
    ports:
      - "8000:8000"
    volumes:
      - ./.data:/app/.data
      - ${INGEST_HOST_MODELS_DIR:-/datastore/models}:/datastore/models
